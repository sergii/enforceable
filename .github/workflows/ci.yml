name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['3.2', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
      - run: bundle exec rubocop
      - name: Demo detects the seeded leak (Pundit)
        run: bash bin/ci/verify_demo pundit
      - name: Demo detects the seeded leak (Action Policy)
        run: bash bin/ci/verify_demo action_policy
      - name: Demo verifies a real CanCanCan ability
        run: bash bin/ci/verify_demo cancancan
