name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['3.2', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
      - run: bundle exec rubocop
      - name: Demo detects the seeded leak (Pundit)
        run: |
          if output=$(bundle exec rake demo 2>&1); then
            echo "Demo unexpectedly passed"
            exit 1
          fi
          echo "$output"
          grep -q "DATA EXPOSURE" <<<"$output"
          grep -q "recruiter" <<<"$output"
          grep -q "confidential_app" <<<"$output"
      - name: Demo detects the seeded leak (Action Policy)
        run: |
          if output=$(BINDING=action_policy bundle exec rake demo 2>&1); then
            echo "Demo unexpectedly passed"
            exit 1
          fi
          echo "$output"
          grep -q "DATA EXPOSURE" <<<"$output"
          grep -q "recruiter" <<<"$output"
          grep -q "confidential_app" <<<"$output"
